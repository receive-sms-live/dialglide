<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DialGlide Privacy Notice</title>
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">DG</div>
        <div><p class="brand-name">DialGlide</p><p class="brand-tagline" data-i18n="tagline"></p></div>
      </div>
      <button class="button small" id="settings-button" type="button" data-i18n="back"></button>
    </header>
    <main class="privacy-shell">
      <span class="pill" data-i18n="privateLocal"></span>
      <h1 data-i18n="privacyPageTitle"></h1>
      <p class="updated" data-i18n="privacyLastUpdated"></p>
      <p class="summary" data-i18n="privacySummary"></p>
      <section><h2 data-i18n="privacyStoredTitle"></h2><p data-i18n="privacyStoredBody"></p></section>
      <section><h2 data-i18n="privacyPermissionsTitle"></h2><p data-i18n="privacyPermissionsBody"></p></section>
      <section><h2 data-i18n="privacySharingTitle"></h2><p data-i18n="privacySharingBody"></p></section>
      <section><h2 data-i18n="privacyControlTitle"></h2><p data-i18n="privacyControlBody"></p></section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
