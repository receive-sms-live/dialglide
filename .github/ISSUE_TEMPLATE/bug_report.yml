name: Bug report
description: Report a reproducible DialGlide problem without personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real phone numbers, private webpage content, credentials, tokens, or browser profiles. Use reserved fictional examples. Report security issues through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Extension 1.0.4 or Core 0.1.0"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the result using sanitized or fictional data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Chrome version and operating system; no profile identifiers"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal, confidential, authentication, and customer data.
          required: true
