name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Package extension
        run: |
          cd dist
          zip -qr ../DialGlide-extension-${GITHUB_REF_NAME#v}.zip .
          cd ..
          sha256sum DialGlide-extension-${GITHUB_REF_NAME#v}.zip > DialGlide-extension-${GITHUB_REF_NAME#v}.zip.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "DialGlide-extension-${GITHUB_REF_NAME#v}.zip"
          "DialGlide-extension-${GITHUB_REF_NAME#v}.zip.sha256"
          --generate-notes
          --title "DialGlide $GITHUB_REF_NAME"
