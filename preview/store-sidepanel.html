<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DialGlide store screenshot</title>
    <link rel="stylesheet" href="store-shot.css">
  </head>
  <body>
    <div class="browser-frame">
      <header class="browser-bar">
        <span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span>
        <div class="address">example.com/contacts</div>
        <div class="extension-chip"><img src="../src/assets/icon-32.png" alt="">DialGlide</div>
      </header>
      <main class="browser-workspace">
        <iframe id="page-preview" title="Example contacts page"></iframe>
        <aside class="side-panel-shell">
          <div class="panel-title"><img src="../src/assets/icon-32.png" alt=""><strong>DialGlide</strong><span>×</span></div>
          <iframe id="panel-preview" title="DialGlide side panel"></iframe>
        </aside>
      </main>
    </div>
    <script src="store-shot.js"></script>
  </body>
</html>
