<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DialGlide settings store screenshot</title>
    <link rel="stylesheet" href="store-shot.css">
  </head>
  <body>
    <div class="browser-frame">
      <header class="browser-bar">
        <span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span>
        <div class="address">DialGlide settings</div>
        <div class="extension-chip"><img src="../src/assets/icon-32.png" alt="">DialGlide</div>
      </header>
      <main class="settings-workspace">
        <iframe id="settings-preview" title="DialGlide settings"></iframe>
      </main>
    </div>
    <script src="store-shot.js"></script>
  </body>
</html>
